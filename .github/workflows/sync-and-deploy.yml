name: Sync and Deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream and merge
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/PAICNI/CFNext.git
          git fetch upstream
          git merge-base --is-ancestor upstream/main HEAD
          if [ $? -eq 0 ]; then
            echo 'has_updates=false' >> $GITHUB_OUTPUT
            echo 'No updates from upstream'
          else
            echo 'has_updates=true' >> $GITHUB_OUTPUT
            git merge upstream/main --no-edit -m 'Sync with upstream PAICNI/CFNext'
            git push origin main
          fi

      - name: Setup Node.js
        if: steps.merge.outputs.has_updates == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Workers
        if: steps.merge.outputs.has_updates == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
